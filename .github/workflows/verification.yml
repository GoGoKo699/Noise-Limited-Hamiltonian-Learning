name: Scientific verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - name: Install numerical dependencies
        run: python -m pip install -r verification/requirements.txt
      - name: Verify explicit matrices and finite observations
        run: python verification/run_all.py
